name: Deploy Feedback to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Check secrets are configured
        shell: bash
        run: |
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SESSION_SECRET; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing configuration: $variable"
              exit 1
            fi
          done
          if [ "${#SESSION_SECRET}" -lt 32 ]; then
            echo "::error::SESSION_SECRET must be at least 32 characters"
            exit 1
          fi
      - name: Deploy Worker, assets and Durable Object migration
        run: npx wrangler deploy
      - name: Install rate-limit hashing secret
        shell: bash
        run: |
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
      - name: Verify live widget
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors https://feedback.shauryaswebsites.com/widget.js >/dev/null
