name: Deploy Feedback to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FEEDBACK_DATABASE_ID: ${{ vars.FEEDBACK_DATABASE_ID }}
      ADMIN_PASSCODE: ${{ secrets.ADMIN_PASSCODE }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Validate deployment configuration
        shell: bash
        run: |
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FEEDBACK_DATABASE_ID ADMIN_PASSCODE SESSION_SECRET; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing Cloudflare configuration: $variable"
              exit 1
            fi
          done
          if [ "${#SESSION_SECRET}" -lt 32 ]; then
            echo "::error::SESSION_SECRET must be at least 32 characters"
            exit 1
          fi
      - name: Set D1 database ID
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file='wrangler.jsonc';
          const config=JSON.parse(readFileSync(file,'utf8'));
          config.d1_databases[0].database_id=process.env.FEEDBACK_DATABASE_ID;
          writeFileSync(file,JSON.stringify(config,null,2)+'\n');
          NODE
      - name: Apply production database migrations
        run: npx wrangler d1 migrations apply feedback-db --remote
      - name: Deploy Worker and frontend
        run: npx wrangler deploy
      - name: Configure production Worker secrets
        shell: bash
        run: |
          printf '%s' "$ADMIN_PASSCODE" | npx wrangler secret put ADMIN_PASSCODE
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
      - name: Verify public endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            https://feedback.shauryaswebsites.com/widget.js >/dev/null
